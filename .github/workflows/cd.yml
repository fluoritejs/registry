name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit tests
        run: npm test

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fluoritejs/registry
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false
      - name: Build and push immutable version tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compare candidate version with currently promoted latest
        id: promote
        env:
          IMAGE: ghcr.io/fluoritejs/registry
          CANDIDATE: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PROMOTE="true"
          if docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            CURRENT="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE:latest" || true)"
            if [ -z "$CURRENT" ]; then
              echo "Could not read the version of the promoted latest tag; promoting latest"
                      elif node -e '
          const [cand, cur] = process.argv.slice(1);
          const parse = (v) => {
            const cleaned = v.replace(/^v/, "").split("+")[0];
            const dash = cleaned.indexOf("-");
            const core = dash === -1 ? cleaned : cleaned.slice(0, dash);
            const pre = dash === -1 ? null : cleaned.slice(dash + 1);
            return {
              nums: core.split(".").map((n) => parseInt(n, 10)),
              pre: pre ? pre.split(".") : null,
            };
          };
          const cmp = (a, b) => {
            for (let i = 0; i < 3; i++) {
              if (a.nums[i] !== b.nums[i]) return a.nums[i] - b.nums[i];
            }
            if (a.pre === null && b.pre === null) return 0;
            if (a.pre === null) return 1;
            if (b.pre === null) return -1;
            for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
              const x = a.pre[i];
              const y = b.pre[i];
              if (x === undefined) return -1;
              if (y === undefined) return 1;
              const xn = /^\d+$/.test(x);
              const yn = /^\d+$/.test(y);
              if (xn && yn) {
                const d = parseInt(x, 10) - parseInt(y, 10);
                if (d !== 0) return d;
              } else if (xn) return -1;
              else if (yn) return 1;
              else {
                const d = x < y ? -1 : x > y ? 1 : 0;
                if (d !== 0) return d;
              }
            }
            return 0;
          };
          process.exit(cmp(parse(cand), parse(cur)) >= 0 ? 0 : 1);
          ' "$CANDIDATE" "$CURRENT"; then
              echo "Candidate ${CANDIDATE} is not lower than the promoted latest ${CURRENT}; promoting latest"
            else
              echo "Candidate ${CANDIDATE} is lower than the promoted latest ${CURRENT}; skipping latest promotion"
              PROMOTE="false"
            fi
          else
            echo "No existing latest tag found; promoting latest"
          fi
          echo "promote=${PROMOTE}" >> "$GITHUB_OUTPUT"
      - name: Promote latest
        if: steps.promote.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/fluoritejs/registry
          CANDIDATE: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create "$IMAGE:$CANDIDATE" --tag "$IMAGE:latest"
          echo "Promoted $IMAGE:$CANDIDATE to $IMAGE:latest"
