# Settings the server needs to boot at all. After updating this file, restart the server.

server:
  port: 3000
  publicBaseUrl: https://fluorite.sdisk.us
  # Required except for loopback addresses (127.0.0.1 / localhost).
  requireHttps: true

storage:
  dataDir: ./data
  # Resolved paths at boot: <dataDir>/registry.sqlite, <dataDir>/blobs/

admin:
  # First signups are not auto-promoted to admin. Provision an admin via
  # bootstrapAccount below instead.
  firstUserBecomesAdmin: false

  # Required when firstUserBecomesAdmin is false. The password is sourced from
  # the environment (passwordFromEnv) or a secret file (passwordFile), never
  # stored in deployment.yaml. It is hashed on first boot, then discarded; the
  # account keeps working via its hashed credentials, so the secret can be
  # removed or rotated after the account exists.
  bootstrapAccount:
    namespace: admin
    passwordFromEnv: FLUORITE_BOOTSTRAP_PASSWORD # operator generated, 8+ chars
    displayName: Administrator
